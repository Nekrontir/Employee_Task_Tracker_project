{% extends "base_ui.html" %}

{% block title %}Вход — Трекер задач{% endblock %}

{% block content %}
  <h1 class="mb-3">Вход в систему</h1>
  <p class="text-muted">
    Авторизация по адресу электронной почты и паролю.
  </p>

  {% if form.errors %}
    <div class="alert alert-danger">
      Неверные данные для входа. Попробуйте ещё раз.
    </div>
  {% endif %}

  <form method="post" class="mt-3" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_username" class="form-label">Email</label>
      <input type="email"
             name="username"
             class="form-control"
             id="id_username"
             required>
    </div>
    <div class="mb-3">
      <label for="id_password" class="form-label">Пароль</label>
      <input type="password"
             name="password"
             class="form-control"
             id="id_password"
             required>
    </div>
    <button type="submit" class="btn btn-primary">
      Войти
    </button>
  </form>
{% endblock %}
