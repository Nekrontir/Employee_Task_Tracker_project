[project]
name = "employee-task-tracker-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Viktor",email = "klarkkent0314@gmail.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "gunicorn (>=26.0.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]
env = [
    "python-dotenv (>=1.2.2,<2.0.0)"
]
db = [
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "redis (>=8.0.1,<9.0.0)"
]
dev = [
    "coverage (>=7.15.0,<8.0.0)"
]

[tool.black]
line-length = 119
target-version = ['py312', 'py313', 'py314']

[tool.isort]
profile = "black"
line_length = 119
